version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: shortlister-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shortlister}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shortlister}
      POSTGRES_DB: ${POSTGRES_DB:-resume_shortlister}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortlister"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shortlister-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: shortlister-backend
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://shortlister:shortlister@postgres:5432/resume_shortlister
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ../uploads:/app/uploads
      - ../vector_store:/app/vector_store
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: shortlister-celery
    command: celery -A backend.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://shortlister:shortlister@postgres:5432/resume_shortlister
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ../uploads:/app/uploads
      - ../vector_store:/app/vector_store
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: shortlister-frontend
    env_file:
      - ../.env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXTAUTH_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
