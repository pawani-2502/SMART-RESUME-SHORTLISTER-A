name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shortlister
          POSTGRES_PASSWORD: shortlister
          POSTGRES_DB: resume_shortlister
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run unit tests
        run: pytest tests/unit -v
        env:
          DATABASE_URL: postgresql+asyncpg://shortlister:shortlister@localhost:5432/resume_shortlister

      - name: Run integration tests
        run: pytest tests/integration -v
        env:
          DATABASE_URL: postgresql+asyncpg://shortlister:shortlister@localhost:5432/resume_shortlister
          API_SECRET_KEY: test-secret-key

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        run: |
          npm install
          npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f docker/Dockerfile.backend -t shortlister-backend .

      - name: Build frontend image
        run: docker build -f docker/Dockerfile.frontend -t shortlister-frontend .
